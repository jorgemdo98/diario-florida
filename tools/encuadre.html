<!doctype html>
<!--
  Reencuadra una foto para la portada: desplaza la imagen (dx, dy en px sobre 1600×1200) y rellena
  el hueco con la misma foto difuminada. Útil cuando el titular tapa a los jugadores.
  Uso: tools/encuadre.html?foto=../img/ig/j8-1.webp&dx=608&dy=0&z=0.85  (render con Chrome headless 1600×1200)
-->
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0}
  html,body{width:1600px;height:1200px;overflow:hidden;background:#000}
  .fondo{position:absolute;inset:-60px;width:1720px;height:1320px;object-fit:cover;filter:blur(28px) brightness(.8)}
  .frente{position:absolute;width:1600px;height:1200px;object-fit:cover;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 22%),linear-gradient(to top,transparent 0,#000 12%);-webkit-mask-composite:source-in;mask-composite:intersect}
</style></head><body>
<img class="fondo" id="a"><img class="frente" id="b">
<script>
  const q = new URLSearchParams(location.search), f = q.get("foto");
  a.src = b.src = f;
  const z = +q.get("z") || 1; b.style.width = 1600 * z + "px"; b.style.height = 1200 * z + "px";
  b.style.left = (+q.get("dx") || 0) + "px";
  b.style.top = (+q.get("dy") || 0) + "px";
</script>
</body></html>
